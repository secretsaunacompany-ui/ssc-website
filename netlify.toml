# Netlify Configuration for Analytics

[build]
  command = "npx @11ty/eleventy"
  publish = "dist"
  # Functions directory
  functions = "netlify/functions"

[build.environment]
  # Node version for functions
  NODE_VERSION = "18"

# Redirect rules (optional)
[[redirects]]
  from = "/analytics"
  to = "https://ops.secretsaunacompany.ca/"
  status = 302

[[redirects]]
  from = "/ops"
  to = "/booking-ops.html"
  status = 200
  force = true

[[redirects]]
  from = "/process/"
  to = "/about/"
  status = 301

[[redirects]]
  from = "/process"
  to = "/about/"
  status = 301

[[redirects]]
  from = "/gallery/"
  to = "/saunas/"
  status = 301

[[redirects]]
  from = "/gallery"
  to = "/saunas/"
  status = 301

[[redirects]]
  from = "/rental/"
  to = "/locations/"
  status = 301

[[redirects]]
  from = "/rental"
  to = "/locations/"
  status = 301

# Headers for security
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    # SECURITY: Content Security Policy - restricts what resources can be loaded
    # Adjust 'script-src' and 'style-src' domains as needed for your CDNs
    # ssc-ops.netlify.app is Lee's own Netlify property and the origin of the
    # centralized analytics tracker loaded in src/_includes/scripts.njk. Without
    # it in script-src AND connect-src the tracker neither loads nor posts, which
    # is why this site recorded no analytics at all until 2026-07-28. Granting it
    # script execution here is a deliberate supply-chain call: it is first-party
    # infrastructure serving five sites, and self-hosting would fork a working
    # centralized tracker five ways. Revisit if that site gains contributors.
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://cdn.jsdelivr.net https://unpkg.com https://ssc-ops.netlify.app; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://unpkg.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' https://res.cloudinary.com https://*.basemaps.cartocdn.com data:; media-src 'self' https://res.cloudinary.com; connect-src 'self' https://*.supabase.co https://unpkg.com https://formspree.io https://cdn.jsdelivr.net https://script.google.com https://ssc-ops.netlify.app; frame-ancestors 'none'; base-uri 'self'; form-action 'self' https://formspree.io"
    # SECURITY: Permissions Policy - restricts browser features
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"

# Canonical domain: www
[[redirects]]
  from = "https://secretsaunacompany.ca/*"
  to = "https://www.secretsaunacompany.ca/:splat"
  status = 301
  force = true

# Force HTTPS redirect
[[redirects]]
  from = "http://secretsaunacompany.ca/*"
  to = "https://www.secretsaunacompany.ca/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.secretsaunacompany.ca/*"
  to = "https://www.secretsaunacompany.ca/:splat"
  status = 301
  force = true

# Cache static assets
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Don't cache HTML
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Cache JS assets with long-term immutable headers
[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Cache CSS with long-term immutable headers
[[headers]]
  for = "/styles.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Cache analytics scripts
[[headers]]
  for = "/analytics-*.js"
  [headers.values]
    Cache-Control = "public, max-age=3600"
