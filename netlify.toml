# Netlify Configuration for Analytics

[build]
  # `rm -rf dist` is load-bearing, not tidiness. Eleventy does not clean its own
  # output directory, and Netlify restores a cached publish dir between builds.
  # Without this, a file deleted from the repo keeps being served forever: the
  # build writes fresh output over the stale copy and never removes it. That is
  # exactly how analytics-dashboard-netlify.html and supabase-schema.sql came
  # back from the dead on 2026-07-28 after being deleted, verified 404, and then
  # silently resurrected by the next git-triggered build.
  command = "rm -rf dist && npx @11ty/eleventy"
  publish = "dist"
  # Functions directory
  functions = "netlify/functions"

[build.environment]
  # Node version for functions.
  # Bumped 18 -> 22 on 2026-08-06: Node 18 reached EOL April 2025 and AWS Lambda
  # (the functions substrate) has deprecated nodejs18.x — rot with a deadline
  # that would have fired during an unrelated deploy. Both functions are plain
  # CommonJS; all nine files under netlify/functions pass `node --check` on 22.
  #
  # RESTORED 2026-09-02. This bump shipped on 2026-08-07 and ran live for two
  # days, then the Cloudinary merge (4407858) resolved a conflict in this file
  # by taking its own side wholesale and put 18 back without a word. Nobody
  # decided that. The ROADMAP then recorded the bump as still-to-do "needs its
  # own plan", and the npm-audit plan of 2026-08-23 read 18 back out of this
  # file and wrote it down as the CI target — a silent revert laundered into a
  # documented constraint in two hops. Deploy-time checklist: one /ops auth
  # round-trip and an advisor 503 on the draft URL.
  NODE_VERSION = "22"

