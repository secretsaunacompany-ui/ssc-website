# Force HTTPS redirect
[[redirects]]
  from = "http://secretsaunacompany.ca/*"
  to = "https://www.secretsaunacompany.ca/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.secretsaunacompany.ca/*"
  to = "https://www.secretsaunacompany.ca/:splat"
  status = 301
  force = true

# Cache static assets
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/video/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Don't cache HTML
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Cache JS assets with long-term immutable headers
[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Cache CSS with long-term immutable headers
[[headers]]
  for = "/styles.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Cache self-hosted fonts forever. Safe precisely because the filenames carry a
# content hash: different bytes produce a different URL, so `immutable` can
# never pin a visitor to a stale face the way a hand-typed ?v= stamp could.
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Cache analytics scripts
[[headers]]
  for = "/analytics-*.js"
  [headers.values]
    Cache-Control = "public, max-age=3600"
