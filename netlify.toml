# Headers for security
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    # X-XSS-Protection was dropped 2026-08-06 and is deliberately not back:
    # deprecated, ignored by every modern browser, and its sniffer had real
    # bypass history in the ones that honoured it. It returned only because the
    # 2026-08-09 merge reverted this whole file.
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    # SECURITY: Content Security Policy - restricts what resources can be loaded
    # Adjust 'script-src' and 'style-src' domains as needed for your CDNs
    # ssc-ops.netlify.app is Lee's own Netlify property and the origin of the
    # centralized analytics tracker loaded in src/_includes/scripts.njk. Without
    # it in script-src AND connect-src the tracker neither loads nor posts, which
    # is why this site recorded no analytics at all until 2026-07-28. Granting it
    # script execution here is a deliberate supply-chain call: it is first-party
    # infrastructure serving five sites, and self-hosting would fork a working
    # centralized tracker five ways. Revisit if that site gains contributors.
    # Fonts are self-hosted as of WP-1a, so this policy SHRANK:
    # https://fonts.googleapis.com left style-src and https://fonts.gstatic.com
    # left font-src. Nothing was added. font-src is now 'self' alone.
    #
    # THE TWO INLINE-SCRIPT HASHES, restored and corrected 2026-09-02.
    # script-src carries no 'unsafe-inline', so an inline <script> runs only if
    # its sha256 is named here. Two exist and both are functional, not cosmetic:
    #   Du+OJK…  head.njk's reveal-boot — adds `.js` to <html> at parse time.
    #            Every hidden state in the reveal system is `.js`-gated, so
    #            without it the whole choreography, including the hero-first
    #            arrival, silently never runs. It degrades safely (content
    #            paints visible, nav works) which is exactly why nobody noticed
    #            for three weeks while analytics cheerfully reported the beat.
    #   SEjhOS…  booking-ops.html's login handler. Without it /ops cannot
    #            authenticate at all and Lee cannot reach reservations.
    #
    # The second hash is NOT the one this file carried on 2026-08-06. That one
    # (gB7jxU…) was measured with a regex that opened its match inside an HTML
    # comment containing a literal `<script>` and hashed 6478 bytes where the
    # browser hashes the element's own 3054 — so the /ops fix was broken for the
    # entire two-day window it was live, certified green by a suite reading the
    # same wrong span. scripts/csp-inline-hash.test.mjs strips comments before
    # scanning as of the same commit; that fix and this value must never be
    # separated, or the suite goes green over a blocked script again.
    #
    # Both hashes went missing entirely in the 2026-08-09 merge, along with the
    # Node bump above. cdn.jsdelivr.net (script-src + connect-src) and
    # script.google.com (connect-src) came back in the same revert and leave
    # again here: nothing in js/, src/ or the built site references either, and
    # an unused script-src origin is free supply-chain surface. unpkg.com stays
    # in all three lists — navigation.js lazy-loads Leaflet from it.
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'sha256-Du+OJKJSbdUgz5nrHeWWINvez6XKDDU/tyj/5c2uvwo=' 'sha256-SEjhOSoJ7I1+WXbx+46BLgZtFqr+xV4VBFTwX45dKQU=' https://unpkg.com https://ssc-ops.netlify.app; style-src 'self' 'unsafe-inline' https://unpkg.com; font-src 'self'; img-src 'self' https://*.basemaps.cartocdn.com data:; media-src 'self'; connect-src 'self' https://*.supabase.co https://unpkg.com https://formspree.io https://ssc-ops.netlify.app; frame-ancestors 'none'; base-uri 'self'; form-action 'self' https://formspree.io"
    # SECURITY: Permissions Policy - restricts browser features
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"

# Canonical domain: www
