# Netlify Configuration for Analytics

[build]
  # `rm -rf dist` is load-bearing, not tidiness. Eleventy does not clean its own
  # output directory, and Netlify restores a cached publish dir between builds.
  # Without this, a file deleted from the repo keeps being served forever: the
  # build writes fresh output over the stale copy and never removes it. That is
  # exactly how analytics-dashboard-netlify.html and supabase-schema.sql came
  # back from the dead on 2026-07-28 after being deleted, verified 404, and then
  # silently resurrected by the next git-triggered build.
  command = "rm -rf dist && npx @11ty/eleventy"
  publish = "dist"
  # Functions directory
  functions = "netlify/functions"

[build.environment]
  # Node version for functions
  NODE_VERSION = "18"

# Redirect rules (optional)
[[redirects]]
  from = "/analytics"
  to = "https://ops.secretsaunacompany.ca/"
  status = 302

[[redirects]]
  from = "/ops"
  to = "/booking-ops.html"
  status = 200
  force = true

[[redirects]]
  from = "/process/"
  to = "/about/"
  status = 301

[[redirects]]
  from = "/process"
  to = "/about/"
  status = 301

[[redirects]]
  from = "/gallery/"
  to = "/saunas/"
  status = 301

[[redirects]]
  from = "/gallery"
  to = "/saunas/"
